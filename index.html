<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Republic of the Golden Horseshoe - Map Creator</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* Custom styling for the new country label */
        .country-label {
            background: rgba(255, 215, 0, 0.9); /* Golden background */
            border: 2px solid #8B4513;
            color: #5c3a04;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Info box styling */
        .info-box {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            max-width: 300px;
        }
        .info-box h2 { margin-top: 0; font-size: 18px; color: #333; }
        .info-box p { font-size: 14px; color: #666; }
        .btn-reset {
            background: #d9534f;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        .btn-reset:hover { background: #c9302c; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Draw JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <script>
        // 1. Initialize the map centered on the Golden Horseshoe (Southern Ontario)
        // Coordinates approx: 43.65° N, 79.38° W (Toronto area)
        const map = L.map('map').setView([43.6532, -79.3832], 8);

        // 2. Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 3. Draw the 49th Parallel (Visual Guide)
        // This line runs across the top of the map to remind the user of the constraint
        const parallel49 = L.polyline([
            [49.0, -125.0], // West Coast approx
            [49.0, -50.0]   // East Coast approx
        ], {
            color: 'red',
            dashArray: '10, 10',
            weight: 2,
            opacity: 0.6
        }).addTo(map);
        
        L.marker([49.0, -90.0], {
            icon: L.divIcon({
                className: 'country-label',
                html: '49th Parallel (Border Limit)',
                iconSize: [150, 30]
            })
        }).addTo(map);

        // 4. Initialize FeatureGroup to store editable layers
        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // 5. Initialize the Draw Control
        const drawControl = new L.Control.Draw({
            edit: {
                featureGroup: drawnItems,
                remove: true
            },
            draw: {
                polygon: {
                    allowIntersection: false,
                    showArea: true,
                    shapeOptions: {
                        color: '#FFD700', // Gold color
                        fillColor: '#FFD700',
                        fillOpacity: 0.6,
                        weight: 3
                    }
                },
                polyline: false,
                circle: false,
                rectangle: false,
                marker: false,
                circlemarker: false
            }
        });
        map.addControl(drawControl);

        // 6. Event: When a shape is created
        map.on(L.Draw.Event.CREATED, function (event) {
            const layer = event.layer;
            
            // Add a popup with the country name
            const area = Math.round(layer.getArea() / 1000000); // Convert to km²
            
            const popupContent = `
                <div style="text-align:center;">
                    <h3 style="margin:5px 0; color:#8B4513;">Republic of the Golden Horseshoe</h3>
                    <p style="margin:0;">Area: <strong>${area} km²</strong></p>
                    <p style="font-size:12px; color:#666;">Officially Recognized (Self-Declared)</p>
                </div>
            `;
            
            layer.bindPopup(popupContent);
            
            // Add a permanent label in the center of the polygon
            const center = layer.getBounds().getCenter();
            const label = L.marker(center, {
                icon: L.divIcon({
                    className: 'country-label',
                    html: 'Republic of the<br>Golden Horseshoe',
                    iconSize: [140, 40],
                    iconAnchor: [70, 20]
                }),
                zIndexOffset: 1000
            });
            
            // Group the polygon and the label so they can be managed together if needed
            const group = L.featureGroup([layer, label]);
            drawnItems.addLayer(group);
        });
    </script>
</body>
</html>
